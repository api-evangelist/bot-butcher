generated: '2026-09-04'
method: searched
source: https://botbutcher.com/documentation
description: >-
  Error catalog for the Bot Butcher Classification API. Derived from the 4xx responses in
  openapi/bot-butcher-classification-api-openapi.yml and enriched from the "Error Responses"
  sections of the provider's published API reference (HTTP 200, fetched 2026-09-04).
format: bespoke-json
rfc9457: false
envelope:
  media_type: application/json
  fields:
    - name: status_code
      type: integer
      description: HTTP status code repeated inside the response body.
    - name: notes
      type: array
      description: >-
        Non-fatal advisory messages returned alongside a successful classification, for example
        "invalid domain" when the supplied domain does not parse.
  note: >-
    The provider documents the meaning of each failure in prose but does not publish the error
    body shape for a 400 or a 401, nor a machine-readable error code vocabulary. There is no
    application/problem+json media type and no type URI.
error_count: 2
errors:
  - code: malformed-request
    status: 400
    title: Malformed request
    operations:
      - classifyMessage
      - getMessage
    causes:
      - Missing JSON payload value on a classify request.
      - Missing required header, including x-api-key.
      - Missing message_id on a retrieve request.
      - Unknown message_id on a retrieve request.
    remediation: >-
      Send a JSON body containing a message string, set the Content-Type and x-api-key headers,
      and confirm the message_id you are retrieving is one this key previously received.
    source: https://botbutcher.com/documentation
  - code: unauthorized
    status: 401
    title: Unauthorized
    operations:
      - classifyMessage
      - getMessage
    causes:
      - Authentication failed — the x-api-key header is absent, malformed or not a valid key.
    remediation: >-
      Send a valid key issued at https://botbutcher.com/get-started in the x-api-key header. Keys
      are per-form, so confirm the key belongs to the form you are classifying for.
    source: https://botbutcher.com/documentation
advisories:
  - code: invalid-domain
    status: 200
    title: Invalid domain supplied
    channel: notes[]
    description: >-
      When the domain in a classify request is not a valid domain, the API still classifies the
      message but returns an additional "notes" array carrying messages such as "invalid domain",
      and accuracy is reduced.
    source: https://botbutcher.com/documentation
gaps:
  - >-
    An unknown message_id is documented as a 400 rather than a 404, so a client cannot distinguish
    a malformed request from a missing resource by status code alone.
  - No 429, 5xx or maintenance response is documented.
  - No stable machine-readable error code or type URI is published.
