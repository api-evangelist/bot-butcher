description: >-
  Client library / SDK inventory for Bot Butcher. Bot Butcher publishes NO client libraries in any
  package registry. The API reference offers copy-paste request snippets in seven languages
  (cURL, Python, JavaScript, TypeScript, Java, C#, Rust) built on each language's stock HTTP
  client — requests, XMLHttpRequest, axios, HttpURLConnection, HttpClient, reqwest — and no
  vendor package. Integration is a single POST, so there is little for an SDK to wrap.
