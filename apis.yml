description: >-
  Bot Butcher is an AI-powered spam detection API that uses a fine-tuned large
  language model to classify contact form submissions as spam or legitimate messages.
  The service analyzes messages within the context of what each website is about,
  providing context-aware classification with 99% reported accuracy against the
  provider's own human-graded benchmark. It supports multi-tenant architectures and is
  designed for enterprise scalability across vertical SaaS and website builder
  platforms. The API has two operations — classify a message, retrieve a message by id —
  authenticated with a per-form x-api-key header, and is sold on a single usage-based
  plan whose first ten requests each month are free. Bot Butcher is operated by
  Hillside Lab Inc, a Delaware corporation based in Pasadena, California.
