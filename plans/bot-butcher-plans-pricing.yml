description: >-
  Published pricing for the Bot Butcher Classification API, read verbatim from
  https://botbutcher.com/pricing (fetched 2026-09-04, HTTP 200). Bot Butcher sells a single
  usage-based product with a graduated per-request price and a monthly flat fee that is waived
  below eleven requests a month. This file REPLACES a 2026-05-04 scaffold that carried invented
  Free / Professional / Enterprise tiers, quotas and rate limits the provider has never published.
plan_count: 1
model: usage-based
currency: USD
billingPeriod: month
notes:
  - >-
    The provider presents one plan, labelled "Usage based", with a "Try for free" call to action,
    unlimited forms and email support. There is no named Free / Pro / Enterprise ladder.
  - >-
    The first 10 requests each month are free of both the per-request price and the flat fee.
    A provider blog post (https://botbutcher.com/blog/maximize-privacy) states the same:
    "the first 10 requests each month for free".
  - >-
    No enterprise or contact-sales tier is published, and no annual term or committed-use
    discount is published.
plans:
